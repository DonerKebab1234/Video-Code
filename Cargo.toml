[package]
name = "video-code"
version = "0.1.0"
edition = "2021"
description = "Play any video as live, full-colour ASCII art in a desktop window."
repository = "https://github.com/DonerKebab1234/Video-Code"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
fontdue = "0.9"
rayon = "1"
softbuffer = "0.4"
winit = "0.30"

[profile.release]
lto = "thin"
codegen-units = 1

# Keep debug builds fast enough to actually watch a video.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
